tujuan:L(['Menjelaskan konsep dasar jaringan LAN dan perangkat penyusunnya.','Menjelaskan karakteristik kabel UTP Cat 5E.','Mengenali fungsi alat dan bahan pembuatan kabel straight.','Menerapkan keselamatan kerja.','Menyusun delapan kabel sesuai standar T568B.','Membuat kabel straight dengan langkah kerja yang benar.','Menguji kabel dengan LAN tester dan membaca hasilnya.']),
lan:H('Pengertian')+'<p>LAN (<i>Local Area Network</i>) adalah jaringan komputer yang menghubungkan perangkat dalam area terbatas. Contohnya satu laboratorium, satu gedung sekolah, atau satu kantor.</p>'+H('Fungsi LAN')+L(['Berbagi data dan file antar komputer.','Berbagi printer.','Berbagi koneksi internet.','Memudahkan komunikasi antar komputer.'])+H('Perangkat Penyusun LAN')+T(['Perangkat','Fungsi'],[['Komputer','Mengirim dan menerima data. Komputer memakai kartu jaringan (NIC) untuk terhubung ke LAN.'],['Switch','Menghubungkan banyak perangkat dalam satu LAN.'],['Hub','Menghubungkan banyak perangkat dalam satu LAN. Hub mengirim data ke semua port.'],['Router','Menghubungkan LAN ke jaringan lain, misalnya internet.'],['Kabel jaringan','Membawa sinyal data antar perangkat. Kabel yang paling sering dipakai di LAN adalah kabel UTP.']])+H('Keunggulan Jaringan Berkabel UTP')+L(['Biaya pembangunan lebih murah dibanding jaringan nirkabel.','Transmisi data lebih stabil.','Tidak terpengaruh cuaca.']),

            Fungsi utama dari pilinan kawat tersebut adalah mengurangi interferensi elektromagnetik dan gangguan sinyal antar-kabel. Kabel UTP tidak dilapisi pelindung aluminium <i>foil</i>, sehingga sangat fleksibel dan mudah dipasang.

                }).join('')}

            </table>
          </div>
        </div>

        <!-- Aksi Selanjutnya -->

          <a href="#/simulasi" class="${A.btn}">Coba Simulasi Urutan Kabel Straight</a>

      </section>
    </div>`;
  }

<script>(function(A){
const W=A.WIRES,by=id=>W.find(w=>w.id===id);let slots,sel,res='',st,last=-1,say='',order=[];
const shuffle=()=>{
  order=[...W];
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  if(order.every((w,i)=>w.id===W[i].id)){
    [order[0],order[1]]=[order[1],order[0]];
  }
};
const reset=()=>{last=-1;slots=Array(8).fill(null);sel=null;res='';st=Array(8).fill(null);shuffle()};
A.pages.simulasi={t:'Simulasi Penyusunan Kabel Straight',render:el=>{if(!slots)reset();el.innerHTML='<div id="live" class="sr-only" role="status"></div><div id="st"></div>';bind(el);draw(el)}};

function draw(el,f){

  el.querySelector('#st').innerHTML=`<div class="space-y-6">
    <p class="text-sm text-slate-600 -mt-2">Pilih kabel dari Bank Kabel, lalu klik pin tujuan pada Konektor RJ-45 untuk menempatkannya. Anda juga dapat melakukan drag & drop secara langsung.</p>

      <span>${sel ? '<span class="text-blue-600 font-bold">'+by(sel).name+'</span> dipilih. Klik pin tujuan pada konektor.' : '<span class="font-bold text-slate-900">'+slots.filter(Boolean).length+' dari 8 pin</span> telah terisi.'}</span>
      <span class="text-slate-400 text-xs hidden sm:inline">Standar Pengkabelan: T568B</span>
    </div>

    <div class="rounded-2xl sm:rounded-3xl border border-slate-200/70 bg-white p-4 sm:p-6 lg:p-7 shadow-[0_4px_24px_rgba(15,23,42,0.03)] grid xl:grid-cols-[1fr_minmax(0,2.5fr)] gap-5 sm:gap-6 items-start">
      <!-- Bank Kabel -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold text-slate-900 text-sm sm:text-base">Bank Kabel</h2>
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${bank.length} tersisa</span>
        </div>
        <div class="grid grid-cols-1 min-[480px]:grid-cols-2 md:grid-cols-3 xl:grid-cols-1 gap-2">
          ${bank.map(w => `
            <button data-w="${w.id}" draggable="true" aria-pressed="${sel===w.id}" class="flex items-center gap-3 border rounded-xl p-2.5 min-h-[46px] text-left transition-all ${sel===w.id ? 'bg-blue-50 border-blue-600 ring-2 ring-blue-500/20 text-blue-950 font-semibold shadow-xs' : 'border-slate-200/80 bg-white hover:bg-slate-50 hover:border-slate-300 text-slate-700'}">
              ${A.wire(w)}
              <span class="text-xs sm:text-sm flex-1 font-medium">${w.name}</span>
            </button>
          `).join('') || '<div class="p-4 rounded-xl border border-dashed border-slate-200 text-center text-xs text-slate-400">Semua kabel telah ditempatkan ke konektor.</div>'}
        </div>
      </div>

      <!-- Konektor RJ-45 -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold text-slate-900 text-sm sm:text-base">Konektor RJ-45</h2>

            ${slots.map((id, i) => {
              const w = id && by(id);
              const s = st[i];
              const isSel = sel && slots[i] === sel;
              const borderClass = s === 'ok'
                ? 'border-emerald-300 bg-emerald-50/40 ring-1 ring-emerald-400/20'
                : s === 'bad'
                ? 'border-rose-300 bg-rose-50/40 ring-1 ring-rose-400/20'
                : isSel
                ? 'bg-blue-50 border-blue-500 ring-2 ring-blue-500/20'
                : 'border-slate-200/80 bg-white hover:border-slate-300 shadow-2xs';

              return `
                <button data-s="${i}" ${id ? 'draggable="true"' : ''} aria-label="Pin ${i+1}, ${w ? w.name : 'kosong'}" class="flex sm:flex-col items-center justify-between sm:justify-start gap-2.5 sm:gap-2 border rounded-xl p-2.5 sm:py-3 sm:px-1.5 min-h-[54px] sm:min-h-[175px] transition-all ${borderClass} ${i===last?'pop':''}">

                  <span class="text-xs font-bold ${s==='ok'?'text-emerald-700':s==='bad'?'text-rose-700':'text-slate-800'}">Pin ${i+1}</span>

                  </div>
                  
                  <!-- Badge Status Rapi & Sejajar -->
                  <div class="mt-0.5 sm:mt-auto flex items-center justify-center w-full">

                        <svg class="w-3 h-3 text-emerald-700 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>

function place(i){
  const w=by(sel);
  if(slots[i]===sel){sel=null;last=-1;say='Pilihan dibatalkan.';return}
  const from=slots.indexOf(sel),t=slots[i];
  slots[i]=sel;
  if(from>-1)slots[from]=t;
  sel=null;last=i;
  say=w.name+' ditempatkan di pin '+(i+1)+'.'+(t?' '+by(t).name+(from>-1?' dipindah ke pin '+(from+1):' kembali ke bank')+'.':'');
}

function bind(el){
  el.onclick=e=>{
    const b=e.target.closest('[data-w],[data-s],[data-a]');
    if(!b)return;
    const d=b.dataset;
    if(d.w){
      sel=sel===d.w?null:d.w;
      say=sel?by(sel).name+' dipilih. Pilih pin tujuan.':'Pilihan dibatalkan.';
      draw(el,`[data-w="${d.w}"]`);
    } else if(d.s!==undefined){
      const i=+d.s;
      if(sel){place(i);res='';st.fill(null)}
      else if(slots[i]){sel=slots[i];say=by(sel).name+' dipilih. Pilih pin tujuan.'}
      draw(el,`[data-s="${i}"]`);
    } else if(d.a==='back'){
      const k=slots.indexOf(sel);
      if(k>-1)slots[k]=null;
      say=by(sel).name+' dikembalikan ke bank.';
      sel=null;res='';st.fill(null);
      draw(el);
    } else if(d.a==='reset'){
      const go=()=>{reset();say='Simulasi diatur ulang.';draw(el)};
      slots.some(Boolean)?A.ask('Kembalikan semua kabel ke bank? Susunan Anda akan hilang.','Atur Ulang',go):go();
    } else if(d.a==='check'){
      check(el);
    }
  };
  el.ondragstart=e=>{
    const b=e.target.closest('[data-w],[data-s]');
    if(!b)return;
    sel=b.dataset.w||slots[+b.dataset.s];
    e.dataTransfer.setData('text/plain',sel);
  };
  el.ondragover=e=>{
    if(e.target.closest('[data-s]'))e.preventDefault();
  };
  el.ondrop=e=>{
    const b=e.target.closest('[data-s]');
    if(!b||!sel)return;
    e.preventDefault();
    place(+b.dataset.s);
    res='';st.fill(null);
    draw(el);
  };
}

function check(el){
  if(slots.includes(null)){
    st=slots.map(x=>x?null:'empty');
    res=A.notice('warn','Masih ada posisi pin yang kosong. Tempatkan semua delapan kabel sebelum memeriksa susunan.');
  } else {
    st=slots.map((id,i)=>id===W[i].id?'ok':'bad');
    const bad=st.map((s,i)=>s==='bad'?i:-1).filter(i=>i>-1);
    if(!bad.length){
      res=A.notice('ok','Susunan simulasi benar! Seluruh 8 pin kabel straight (standar T568B) telah tersusun dengan tepat.');
      A.mark('simulasi');
    } else {
      const badPins = bad.map(i => `Pin ${i+1}`).join(', ');
      res=A.notice('err', `Belum tepat. ${8-bad.length} dari 8 pin benar. Periksa kembali: <b>${badPins}</b>. Lalu coba lagi.`);
    }
  }
  say=res.replace(/<[^>]+>/g,'');
  draw(el);
  el.querySelector('#fb')?.scrollIntoView({behavior:'smooth',block:'nearest'});
}
})(App);
</script>

function bind(el) {
  el.onclick = e => {
    const btn = e.target.closest('[data-action="reset-all"]');
    if (btn) {
      doneSteps.clear();
      checkedTools.clear();
      testedDone = false;
      try { 
        sessionStorage.removeItem('panduan_done'); 
        sessionStorage.removeItem('panduan_tools'); 
        sessionStorage.removeItem('panduan_tested'); 
      } catch(e){}
      draw(el);
      return;
    }
  };

  el.onchange = e => {
    const chkTool = e.target.closest('input[data-tool]');
    if (chkTool) {
      const idx = +chkTool.dataset.tool;
      if (chkTool.checked) {
        checkedTools.add(idx);
      } else {
        checkedTools.delete(idx);
      }
      try {
        sessionStorage.setItem('panduan_tools', JSON.stringify([...checkedTools]));
      } catch(e){}
      draw(el);
      return;
    }

    const chkStep = e.target.closest('input[data-step]');
    if (chkStep) {
      const idx = +chkStep.dataset.step;
      if (chkStep.checked) {
        doneSteps.add(idx);
      } else {
        doneSteps.delete(idx);
      }
      try {
        sessionStorage.setItem('panduan_done', JSON.stringify([...doneSteps]));
      } catch(e){}
      if (doneSteps.size === S.length) {
        A.mark('panduan');
      }
      draw(el);
      return;
    }

    const chkTested = e.target.closest('input[data-action="toggle-tested"]');
    if (chkTested) {
      testedDone = chkTested.checked;
      try {
        sessionStorage.setItem('panduan_tested', testedDone ? '1' : '0');
      } catch(e){}
      if (testedDone) {
        A.mark('panduan');
      }
      draw(el);
      return;
    }
  };
}

  const pct=Math.round(n/L.length*100);
  $('#sp').innerHTML=`<div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/70">
    <div class="flex items-center justify-between text-xs font-semibold text-slate-700 mb-2">
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-600"></span>Progres Belajar</span>
      <span class="font-bold text-blue-600 tabular-nums">${n}/${L.length}</span>
    </div>
    <div class="w-full bg-slate-200/80 rounded-full h-2 overflow-hidden">
      <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width:${pct}%"></div>
    </div>
  </div>`;
  $('#mp').textContent=`${n}/${L.length} selesai`;
  $('#nav').innerHTML=A.NAV.map(([id,l])=>{
    const isCur = id === k;
    const isDone = A.done.has(id);
    return `<li><a href="#/${id}" ${isCur?'aria-current="page"':''} class="flex justify-between items-center min-h-[42px] px-3.5 rounded-xl text-sm transition-all ${isCur?'bg-blue-50 text-blue-700 font-semibold shadow-xs border border-blue-200/70':'text-slate-600 hover:text-slate-950 hover:bg-slate-100/80 font-medium'}"><span class="flex items-center gap-3">${A.ic(A.NAVIC[id],'w-4 h-4')}${l}</span>${isDone?'<span class="flex items-center justify-center w-5 h-5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200/60">'+A.ic('check','w-3 h-3')+'</span>':''}</a></li>`;
  }).join('');
}
let cur='beranda';
function close(){$('#bd').classList.add('hidden');side.classList.remove('open');menu.setAttribute('aria-expanded','false')}
function route(){
  close();
  let id=location.hash.replace('#/','')||'beranda';if(id==='tujuan'||id==='lan'||id==='utp'||id==='t568b')id='materi';if(id==='checklist'||id==='tester')id='panduan';cur=A.pages[id]?id:'beranda';
  const p=A.pages[cur],i=A.NAV.findIndex(n=>n[0]===cur),v=$('#view');
  document.body.dataset.m=p.landing?'l':'a';
  document.body.dataset.t=['materi','lan','utp','alat','checklist','keselamatan','t568b'].includes(cur)?'b':['simulasi','panduan','tester','evaluasi'].includes(cur)?'c':'a';
  v.innerHTML=p.landing?'<div id="pg"></div><div id="pn"></div>':`<div class="mb-6 pb-6 border-b border-slate-200/70"><div class="flex items-center gap-2 mb-2.5"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-100/80">Modul ${i+1} dari ${A.NAV.length}</span><span class="text-xs text-slate-300">•</span><span class="text-xs font-semibold tracking-wide text-slate-400 uppercase">${A.LABEL[cur]||''}</span></div><h1 id="h1" tabindex="-1" class="text-2xl sm:text-3xl lg:text-4xl font-bold tracking-tight text-slate-900">${p.t}</h1></div><div id="pg"></div><div id="pn" class="flex flex-wrap justify-between gap-3 mt-10 pt-6 border-t border-slate-200/70"></div>`;
  try{p.render($('#pg'))}catch(e){console.error(e);$('#pg').innerHTML=A.notice('err','Bagian ini tidak dapat dimuat. Muat ulang halaman atau kembali ke materi.')}
  if(!A.MANUAL.includes(cur))A.mark(cur);
  if(!p.nonav){const pv=A.NAV[i-1],nx=A.NAV[i+1];$('#pn').innerHTML=(pv?`<a href="#/${pv[0]}" class="${A.btn2}">Sebelumnya: ${pv[1]}</a>`:'<span></span>')+(nx?`<a href="#/${nx[0]}" class="${A.btn}">Lanjut: ${nx[1]} </a>`:'')}
  nav(cur);close();window.scrollTo(0,0);($('#h1')||$('#pg h1')).focus();
}
A.onMark=()=>nav(cur);
menu.onclick=()=>{const o=side.classList.toggle('open');menu.setAttribute('aria-expanded',o);$('#bd').classList.toggle('hidden',!o);if(o)side.querySelector('a').focus()};
$('#bd').onclick=()=>{close();menu.focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&side.classList.contains('open')){close();menu.focus()}});
addEventListener('hashchange',route);route();
})(App);
</script>
